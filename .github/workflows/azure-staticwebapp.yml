name: CI/CD React App

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy and build on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            if [ ! -d "/home/sdembele/cicd/.git" ]; then
              rm -rf /home/sdembele/cicd
              git clone https://github.com/Severin-Dembele/ci_cd.git /home/sdembele/cicd
            else
              cd /home/sdembele/cicd
              git pull origin main
            fi
            cd /home/sdembele/cicd
            npm install
            npm run build
            echo ${{ secrets.SSH_PASSWORD }} | sudo -S systemctl restart nginx

name: CI/CD React App

on:
  push:
    branches:
      - main   # déclenchement sur push vers main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # forcer Node.js 24 dès maintenant

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # utiliser Node.js 24

      - name: Deploy and build on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/sdembele/cicd
            git pull https://github.com/Severin-Dembele/ci_cd.git main
            npm install
            npm run build
            sudo systemctl restart nginx
